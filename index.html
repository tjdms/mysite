<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>환영합니다</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #f4f6fb;
      color: #1f2937;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 { margin: 0 0 24px; font-size: 1.5rem; }
    form { display: flex; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      font-size: 1rem;
      border: 1px solid #d1d5db;
      border-radius: 10px;
    }
    input:focus { outline: 2px solid #4f46e5; border-color: transparent; }
    button {
      padding: 12px 18px;
      font-size: 1rem;
      border: 0;
      border-radius: 10px;
      background: #4f46e5;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    #greeting {
      margin-top: 24px;
      font-size: 1.25rem;
      font-weight: 600;
      color: #4f46e5;
      min-height: 1.5em;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>이름을 입력해주세요</h1>
    <form id="nameForm">
      <input type="text" id="nameInput" placeholder="이름" autocomplete="name" required>
      <button type="submit">확인</button>
    </form>
    <p id="greeting" aria-live="polite"></p>
  </main>

  <script>
    const form = document.getElementById('nameForm');
    const input = document.getElementById('nameInput');
    const greeting = document.getElementById('greeting');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = input.value.trim();
      greeting.textContent = name ? `${name} 님 어서오세요` : '';
    });
  </script>
</body>
</html>
